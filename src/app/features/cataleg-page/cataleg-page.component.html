<div class="container">
    <h2>Catàleg complet de peces</h2>


    <!-- Loading -->
    <div *ngIf="loading" class="loading">Carregant elements...</div>

    <!-- Error -->
    <div *ngIf="error" class="error">{{ error }}</div>

    <!-- Llistat -->
    <cdk-virtual-scroll-viewport *ngIf="!loading && !error" itemSize="140" class="viewport-scroll">
        <app-item-card *cdkVirtualFor="let item of items; trackBy: trackByItemId" class="item-card" [item]="item"
            (cardClick)="viewDetail($event)">
        </app-item-card>
    </cdk-virtual-scroll-viewport>
</div>
