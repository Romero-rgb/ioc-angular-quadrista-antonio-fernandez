<header class="header">
    <div class="container">
        <h1>

            <a routerLink="/cataleg">Catàleg de Quadrista</a>

        </h1>

        <nav class="nav">
            <a routerLink="/cataleg" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
                class="nav-link"> Catàleg </a>
            <a routerLink="/cerca" routerLinkActive="active" class="nav-link"> Cerca </a>
            <a routerLink="/preferits" routerLinkActive="active" class="nav-link"> Meus preferits </a>

            <div class="auth-status" *ngIf="user$ | async as user; else noAutenticat">
                <span class="usuari-nom">Hola, {{user.nom}}</span>
                <button (click)="logout()" class="btn-logout"> Sortir</button>
            </div>
            <ng-template #noAutenticat>
                <a routerLink="/login" routerLinkActive="active" class="nav-link"> Login </a>
            </ng-template>

        </nav>
    </div>

</header>
