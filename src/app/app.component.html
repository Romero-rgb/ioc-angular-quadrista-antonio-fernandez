<div class="title">
  <h1>Quadrista</h1>
  <p>Antonio Fernández Romero</p>
</div>
<main class="contenidor">
  <header>
    <h1>Catàleg d'Elements</h1>
    <p></p>
  </header>

  <app-barra-cerca (searchChange)="filterTheElements($event)"></app-barra-cerca>

  <div *ngIf="actualSearch" class="info-resultats" aria-live="polite">
    <p>
      <strong>{{ filterElements.length }}</strong>
      {{ filterElements.length === 1 ? 'resultat' : 'resultats' }}
      per <em>"{{ actualSearch }}"</em>
    </p>
  </div>

  <app-llista-elements [elements]="filterElements"></app-llista-elements>
</main>
