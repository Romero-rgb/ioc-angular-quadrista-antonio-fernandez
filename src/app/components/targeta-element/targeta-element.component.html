<article class="targeta">
    <div class="targeta-contingut">
        <h3>{{ element.name | uppercase }}</h3>

        <p>Valor: {{ element.value }}</p>

        <div class="targeta-info">
            <span class="name">
                ID: {{ element.id }}
            </span>

            <span *ngIf="element.category" class="category">
                <i class="bi bi-star-fill" aria-hidden="true"></i> {{ element.category }}
            </span>
        </div>
    </div>
</article>
